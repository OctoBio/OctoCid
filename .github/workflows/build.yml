name: Build OctoCid (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.14-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: OctoCid-VST3-Windows
          path: build/OctoCid_artefacts/Release/VST3/OctoCid.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: OctoCid-Standalone-Windows
          path: build/OctoCid_artefacts/Release/Standalone/OctoCid.exe
